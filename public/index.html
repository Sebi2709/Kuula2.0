<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>360° Rundgänge</title>
  <link rel="stylesheet" href="assets/style.css">
</head>
<body>
  <div class="page">
    <header>
      <h1>360° Rundgänge</h1>
      <a class="btn primary" href="editor.html">+ Tour erstellen / bearbeiten</a>
    </header>
    <div id="tours"></div>
  </div>
  <div class="toast" id="toast" style="position:fixed"></div>
  <script type="module">
    import { loadTourIndex, escapeHtml } from './assets/tour.js';

    const container = document.getElementById('tours');
    const tours = (await loadTourIndex()).filter((t) => t.listed !== false);

    if (!tours.length) {
      container.innerHTML = '<p class="empty">Noch keine Touren. Lege im Editor die erste an.</p>';
    }

    const groups = new Map();
    for (const t of tours) {
      const key = t.company || 'Ohne Firma';
      groups.set(key, [...(groups.get(key) || []), t]);
    }
    for (const [company, list] of groups) {
      container.insertAdjacentHTML('beforeend', `<h2>${escapeHtml(company)}</h2><div class="grid"></div>`);
      const grid = container.lastElementChild;
      for (const t of list) {
        const viewUrl = new URL(`view.html?tour=${encodeURIComponent(t.id)}`, location.href).href;
        const card = document.createElement('div');
        card.className = 'card';
        card.innerHTML = `
          <h3>${escapeHtml(t.title)}</h3>
          <div class="meta">${escapeHtml(t.id)}</div>
          <div class="actions">
            <a class="btn primary" href="${escapeHtml(viewUrl)}" target="_blank">Öffnen</a>
            <button data-copy="link">Link kopieren</button>
            <button data-copy="embed">Embed-Code</button>
            <a class="btn" href="editor.html?tour=${encodeURIComponent(t.id)}">Bearbeiten</a>
          </div>`;
        card.addEventListener('click', async (e) => {
          const kind = e.target.dataset.copy;
          if (!kind) return;
          const text = kind === 'link'
            ? viewUrl
            : `<iframe src="${viewUrl}" width="100%" height="600" style="border:0" allow="fullscreen; accelerometer; gyroscope" allowfullscreen loading="lazy"></iframe>`;
          await navigator.clipboard.writeText(text);
          const toast = document.getElementById('toast');
          toast.textContent = kind === 'link' ? 'Link kopiert.' : 'Embed-Code kopiert.';
          toast.classList.add('show');
          setTimeout(() => toast.classList.remove('show'), 2000);
        });
        grid.append(card);
      }
    }
  </script>
</body>
</html>
